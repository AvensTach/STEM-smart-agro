version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.Backend
    container_name: smartagro_backend
    ports:
      - "5297:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=SmartAgroBackend
      - Jwt__Audience=SmartAgroClients
      - IotSettings__Username=iot-worker-service
      - IotSettings__Password=YOUR_PASSWORD_HERE
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/smartagro.db
    volumes:
     - ./data:/app/data

    
  iot:
    build:
      context: .
      dockerfile: Dockerfile.IoT
    container_name: smartagro_iot
    depends_on:
      - backend
    environment:
      - DOTNET_ENVIRONMENT=Development
      - IotSettings__BaseUrl=http://backend:8080

volumes:
  app_data:
