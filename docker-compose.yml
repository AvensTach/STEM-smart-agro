version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.Backend
    container_name: smartagro_backend
    ports:
      - "5297:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - app_data:/app/data

  iot:
    build:
      context: .
      dockerfile: Dockerfile.IoT
    container_name: smartagro_iot
    depends_on:
      - backend
    environment:
      - DOTNET_ENVIRONMENT=Development
      - IotSettings__BaseUrl=http://backend:8080

volumes:
  app_data: