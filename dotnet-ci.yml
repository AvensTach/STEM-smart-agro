name: .NET CI & Static Analysis

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore SmartAgro.sln

    - name: Build Solution
      run: dotnet build SmartAgro.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test SmartAgro.sln --configuration Release --no-build --verbosity normal